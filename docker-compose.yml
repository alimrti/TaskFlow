services:
  api:
    build: .
    container_name: task-api
    ports:
      - "3000:3000"
    environment:
      - MONGO_URL=mongodb://database:27017/taskdb
    depends_on:
      - database
    networks:
      - task-network

  database:
    image: mongo:7
    container_name: task-database
    volumes:
      - mongo-data:/data/db
    networks:
      - task-network

volumes:
  mongo-data:

networks:
  task-network:
    driver: bridge
